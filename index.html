<meta property="og:title" content="이기업 ♥ 김연선 결혼합니다">

<style>
  @font-face {
    font-family: 'S-CoreDream-3Light';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-3Light.woff') format('woff');
    font-weight: normal; font-style: normal; font-display: swap;
  }
  /* 시안(1179px 폭) 좌표를 그대로 쓰기 위해 1u = 화면폭/1179.
     구간(.blk)마다 --k = 1u × 확대배율이고, 그 안의 기능 위치는 시안 좌표 × --k */
  :root { --bg: #F0EED9; --olive: #505537; --line: #A9A88E; --maxw: 430px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--olive); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { -webkit-tap-highlight-color: transparent; }
  img { display: block; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .page {
    max-width: var(--maxw); margin: 0 auto; background: var(--bg);
    container-type: inline-size; overflow: hidden;
  }
  .page * { --u: calc(100cqw / 1179); }
  .blk { position: relative; width: calc(var(--k) * var(--w)); margin-left: auto; margin-right: auto; }
  .blk > img { width: 100%; height: auto; }
  .hit { position: absolute; display: block; }
  .hand { font-family: 'Hi Melody', cursive; color: var(--olive); text-align: center; word-break: keep-all; }

  /* BGM 버튼 */
  .bgm {
    position: fixed; z-index: 50;
    top: 16px;
    right: max(16px, calc((100vw - var(--maxw)) / 2 + 16px));
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1px solid var(--olive);
    background: rgba(241, 239, 218, .85);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; gap: 3px;
  }
  .bgm i { display: block; width: 1.5px; background: var(--olive); border-radius: 1px; transition: height .3s; }
  .bgm i:nth-child(1) { height: 8px; }
  .bgm i:nth-child(2) { height: 13px; }
  .bgm i:nth-child(3) { height: 20px; }
  .bgm i:nth-child(4) { height: 13px; }
  .bgm i:nth-child(5) { height: 8px; }
  .bgm.playing i { animation: eq 1s ease-in-out infinite; }
  .bgm.playing i:nth-child(2) { animation-delay: -.2s; }
  .bgm.playing i:nth-child(3) { animation-delay: -.5s; }
  .bgm.playing i:nth-child(4) { animation-delay: -.7s; }
  .bgm.playing i:nth-child(5) { animation-delay: -.3s; }
  .bgm:not(.playing) i { height: 3px !important; }
  @keyframes eq { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.35); } }

  /* 티켓: 절취선 아래(시안 y7219~7740)를 떼어내 화면에 들어오면 뜯어지듯 기울어짐 */
  .stub {
    position: absolute; left: calc(var(--k) * 50); top: calc(var(--k) * 1419);
    width: calc(var(--k) * 930);
    transform-origin: 6% 0;
  }
  .stub img { display: block; width: 100%; height: auto; }
  .stub.torn { animation: tear 1.6s cubic-bezier(.3, .1, .25, 1) forwards; }
  @keyframes tear {
    0%   { transform: none; }
    12%  { transform: rotate(-.8deg); }
    24%  { transform: rotate(.9deg); }
    36%  { transform: rotate(-.4deg); }
    100% { transform: translate(calc(var(--k) * 14), calc(var(--k) * 46)) rotate(5deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stub.torn { animation: none; transform: translate(calc(var(--k) * 14), calc(var(--k) * 46)) rotate(5deg); }
  }

  /* 갤러리 */
  .gallery { position: relative; height: calc(var(--u) * 1120); }
  .g-scroll {
    position: absolute; left: calc(var(--u) * 70); top: 0;
    width: calc(var(--u) * 990); height: 100%;
    overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .g-scroll::-webkit-scrollbar { display: none; }
  .g-grid {
    display: grid; grid-template-columns: repeat(3, calc(var(--u) * 300));
    column-gap: calc(var(--u) * 45); row-gap: calc(var(--u) * 90);
    padding: calc(var(--u) * 4) 0;
  }
  .g-item { display: block; text-align: left; }
  .g-item .im { display: block; width: 100%; height: calc(var(--u) * 450); background: var(--olive); overflow: hidden; }
  .g-item img { width: 100%; height: 100%; object-fit: cover; }
  .g-item .no {
    display: block; margin-top: calc(var(--u) * 20);
    font-family: 'S-CoreDream-3Light', sans-serif;
    font-size: calc(var(--u) * 32); line-height: calc(var(--u) * 30); color: #85877A;
  }
  .g-track {
    position: absolute; left: calc(var(--u) * 1092); top: 0;
    width: calc(var(--u) * 15); height: 100%; background: #DAD9BA; border-radius: calc(var(--u) * 8);
  }
  .g-thumb {
    position: absolute; left: calc(var(--u) * -3); top: 0;
    width: calc(var(--u) * 21); height: calc(var(--u) * 60);
    background: var(--olive); border-radius: calc(var(--u) * 11);
    touch-action: none;
  }

  /* 지도: 안쪽 테두리선 안으로 여백을 둬서 네 면이 모두 보이게 */
  .map-frame { position: absolute; left: calc(var(--k) * 36); top: calc(var(--k) * 36); width: calc(var(--k) * 908); height: calc(var(--k) * 630); overflow: hidden; background: var(--bg); }
  .map-frame iframe, .map-frame #naverMap { width: 100%; height: 100%; border: 0; display: block; }

  .note { font-size: calc(var(--u) * 44); line-height: 1.55; padding: 0 calc(var(--u) * 80); margin-top: calc(var(--u) * 40); }
  .thanks { font-size: calc(var(--u) * 50); line-height: 1.4; margin-top: calc(var(--u) * 14); }

  /* 계좌 아코디언 */
  .acc-head { position: relative; display: block; width: 100%; }
  .acc-head img { width: 100%; height: auto; }
  .acc-head .chev {
    position: absolute; left: calc(var(--k) * 837); top: calc(var(--k) * var(--cy));
    width: calc(var(--k) * 43); height: calc(var(--k) * 23);
    transition: transform .35s ease;
  }
  .acc.open .acc-head .chev { transform: rotate(180deg); }
  .acc-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s ease; }
  .acc-body > div { overflow: hidden; }
  .acc.open .acc-body { grid-template-rows: 1fr; }
  .acc-body .blk { width: 100%; }
  .acc.last:not(.open) .acc-head::after {
    content: ''; position: absolute; bottom: 0;
    left: calc(var(--k) * 15); right: calc(var(--k) * 17); height: calc(var(--k) * 2); background: #8E9077;
  }

  /* 방명록 */
  .gb { margin-top: calc(var(--u) * 230); padding: 0 calc(var(--u) * 110); }
  .gb-title { font-family: 'La Belle Aurore', cursive; font-weight: 400; font-size: calc(var(--u) * 92); line-height: 1.2; text-align: center; }
  .gb-lead { font-size: calc(var(--u) * 46); margin-top: calc(var(--u) * 16); }
  .gb-form { margin-top: calc(var(--u) * 50); display: grid; gap: calc(var(--u) * 24); }
  .gb-form input, .gb-form textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 0; background: rgba(255, 255, 255, .45);
    font-family: 'Hi Melody', cursive; font-size: max(16px, calc(var(--u) * 50)); color: var(--olive);
    padding: calc(var(--u) * 22) calc(var(--u) * 28); outline: none; -webkit-appearance: none; appearance: none;
  }
  .gb-form textarea { min-height: calc(var(--u) * 260); resize: vertical; line-height: 1.45; }
  .gb-row { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 24); }
  .gb-form input:focus, .gb-form textarea:focus { border-color: var(--olive); }
  .gb-form .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .gb-count { font-family: 'S-CoreDream-3Light', sans-serif; font-size: calc(var(--u) * 28); color: #85877A; text-align: right; margin-top: calc(var(--u) * -14); }
  .gb-submit, .gb-more {
    justify-self: center; display: block;
    border: 1.5px solid var(--olive); outline: 1px solid var(--olive); outline-offset: calc(var(--u) * -12);
    font-family: 'Hi Melody', cursive; font-size: calc(var(--u) * 50);
    padding: calc(var(--u) * 22) calc(var(--u) * 90);
  }
  .gb-submit:disabled { opacity: .5; }
  .gb-list { list-style: none; margin-top: calc(var(--u) * 70); border-top: 1px solid #8E9077; }
  .gb-list li { padding: calc(var(--u) * 36) calc(var(--u) * 20); border-bottom: 1px solid var(--line); text-align: left; }
  .gb-list .who { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .gb-list .nm { font-family: 'Hi Melody', cursive; font-size: calc(var(--u) * 52); }
  .gb-list .dt { font-family: 'S-CoreDream-3Light', sans-serif; font-size: calc(var(--u) * 28); color: #85877A; white-space: nowrap; }
  .gb-list .meta { display: flex; align-items: baseline; gap: calc(var(--u) * 20); }
  .gb-del { font-family: 'S-CoreDream-3Light', sans-serif; font-size: calc(var(--u) * 28); color: #85877A; text-decoration: underline; padding: 4px 0; }
  .gb-delform { display: flex; gap: calc(var(--u) * 16); margin-top: calc(var(--u) * 20); }
  .gb-delform[hidden] { display: none; }
  .gb-delform input {
    flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 0; background: rgba(255, 255, 255, .45);
    font-size: 16px; color: var(--olive); padding: calc(var(--u) * 14) calc(var(--u) * 22); outline: none;
  }
  .gb-delform button { border: 1px solid var(--olive); font-family: 'Hi Melody', cursive; font-size: calc(var(--u) * 44); padding: 0 calc(var(--u) * 36); }
  .gb-list .msg { font-family: 'Hi Melody', cursive; font-size: calc(var(--u) * 46); line-height: 1.5; margin-top: calc(var(--u) * 8); white-space: pre-wrap; word-break: break-all; }
  .gb-empty { font-size: calc(var(--u) * 44); color: #85877A; padding: calc(var(--u) * 60) 0; border-bottom: 1px solid var(--line); }
  .gb-more { margin: calc(var(--u) * 50) auto 0; }
  .gb-more[hidden] { display: none; }

  .foot {
    padding: calc(var(--u) * 200) 0 calc(var(--u) * 220); text-align: center;
    font-family: 'La Belle Aurore', cursive; font-size: calc(var(--u) * 54); color: #6C7052;
  }

  /* 토스트 */
  .toast {
    position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom)); z-index: 200;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: rgba(60, 64, 40, .92); color: #F1EFDA; padding: 9px 18px; border-radius: 20px;
    font-size: 14px; white-space: nowrap; transition: opacity .3s, transform .3s;
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 라이트박스 */
  .lb {
    position: fixed; inset: 0; z-index: 100; background: rgba(28, 30, 20, .94);
    display: none; align-items: center; justify-content: center; touch-action: pan-y;
  }
  .lb.open { display: flex; }
  .lb img { max-width: 100%; max-height: 82vh; object-fit: contain; user-select: none; -webkit-user-drag: none; }
  .lb .lb-close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; color: #F1EFDA; font-size: 28px; line-height: 1; }
  .lb .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; color: #F1EFDA; font-size: 30px; }
  .lb .lb-prev { left: 4px; }
  .lb .lb-next { right: 4px; }
  .lb .lb-no {
    position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    color: #F1EFDA; font-family: 'S-CoreDream-3Light', sans-serif; letter-spacing: .1em; font-size: 14px;
  }
</style>
</head>
<body>

  <h1 class="sr-only">이기업 ♥ 김연선 결혼합니다. 2027년 1월 2일 토요일 오후 5시, SY컨벤션웨딩홀 9층</h1>

  <button class="bgm" id="bgmBtn" type="button" aria-label="배경음악 재생/정지"><i></i><i></i><i></i><i></i><i></i></button>

  <div class="blk" style="--k:calc(var(--u)*1.3);--w:680;margin-top:calc(var(--u)*40)">

  </div>

  <!-- 인사말 · 혼주 · 일시/장소 (1.22배) -->
  <div class="blk" style="--k:calc(var(--u)*1.22);--w:880;margin-top:calc(var(--u)*240)">
    <img src="images/design/greet.jpg" width="1074" height="1392" loading="lazy" alt="With Love, 하나님께서 허락하신 소중한 인연으로 서로를 깊이 사랑하며 하나 되어 아름답게 살아가겠습니다. 저희의 결혼잔치에 오셔서 따뜻한 축복과 즐거움을 나누어 주시기 바랍니다. 김옥의 장남 이기업, 류영신의 장녀 김연선. 2027년 01월 02일 토요일 오후 5시 SY컨벤션웨딩홀 9층">
  </div>

  <!-- 갤러리 -->
  <div class="blk" style="--k:var(--u);--w:1179;margin-top:calc(var(--u)*300)">
    <img src="images/design/galtitle.jpg" width="1179" height="170" loading="lazy" alt="just Us">
  </div>
  <section class="gallery" aria-label="갤러리" style="margin-top:calc(var(--u)*20)">

  <div class="blk" style="--k:calc(var(--u)*1.25);--w:780;margin-top:calc(var(--u)*50)">
    <img src="images/design/verse.jpg" width="976" height="188" loading="lazy" alt="With all lowliness and meekness, with longsuffering, forbearing one another in love; Endeavouring to keep the unity of the Spirit in the bond of peace.">
  </div>

  <!-- 오시는 길 -->
  <div class="blk" style="--k:var(--u);--w:1179;margin-top:calc(var(--u)*330)">
    <img src="images/design/loctitle.jpg" width="1179" height="120" loading="lazy" alt="Location">
  </div>
  <div class="blk" style="--k:calc(var(--u)*1.3);--w:780;margin-top:calc(var(--u)*10)">
    <img src="images/design/addr.jpg" width="1014" height="76" loading="lazy" alt="경기도 수원시 영통구 봉영로 1612 보보스프라자 9F SY컨벤션">
  </div>
  <div class="blk" style="--k:calc(var(--u)*1.1);--w:980;margin-top:calc(var(--u)*10)">
    <img src="images/design/map.jpg" width="1078" height="936" loading="lazy" alt="">
    <div class="map-frame" id="mapBox" aria-label="SY컨벤션 지도"></div>

  <p class="hand note">본 건물 주차 공간이 협소하여<br>당일 주차 요원 안내에 따라<br>주변 제2, 3공영주차장을 이용하실 수 있습니다.<br>원활한 이동을 위해 대중교통 이용을 권장해 드립니다.</p>

<!-- 카카오맵 약도 설치 스크립트 (document.write를 쓰므로 페이지에 직접 둬야 함) -->
<script charset="UTF-8" class="daum_roughmap_loader_script" src="https://t1.kakaocdn.net/kakaomapweb/roughmap/loader/prod/roughmapLoader.js"></script>
<script>
(function () {
  var PHOTO_COUNT = 20;
  // 칸(2:3)에 잘릴 때 인물이 가운데 오도록: 가로 사진은 object-position,
  // 세로 사진은 살짝 확대하면서 기준점을 옮김 [배율, 기준점]
  var PHOTO_POS = { 3: '48%', 7: '48%', 8: '43%', 11: '48%', 12: '36%', 14: '54%', 20: '72%' };
  var PHOTO_ZOOM = { 2: [1.12, '12%'], 5: [1.12, '97%'], 10: [1.12, '87%'] };
  var PLACE = '수원 SY컨벤션';
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

  /* 토스트 */
  var toastEl = document.getElementById('toast'), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* 복사 */
  function copyText(text, msg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      try { document.execCommand('copy'); toast(msg); } catch (e) { toast('복사에 실패했습니다'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(msg); }, fallback);
    } else fallback();
  }
  document.querySelectorAll('.copy').forEach(function (b) {
    b.addEventListener('click', function () { copyText(b.dataset.copy, b.dataset.msg); });
  });

  /* BGM: 자동재생이 막히면 첫 터치 때 재생 */
  var audio = document.getElementById('bgm'), bgmBtn = document.getElementById('bgmBtn');
  var userPaused = false;
  audio.volume = 0.6;
  audio.addEventListener('play', function () { bgmBtn.classList.add('playing'); });
  audio.addEventListener('pause', function () { bgmBtn.classList.remove('playing'); });
  var UNLOCK_EVENTS = ['click', 'touchend', 'keydown'];
  function tryPlay() {
    var p = audio.play();
    return p && p.then ? p : Promise.resolve();
  }
  function stopUnlock() {
    UNLOCK_EVENTS.forEach(function (ev) { document.removeEventListener(ev, firstTouch, true); });
  }
  bgmBtn.addEventListener('click', function () {
    stopUnlock();
    if (audio.paused) { userPaused = false; tryPlay().catch(function () {}); }
    else { userPaused = true; audio.pause(); }
  });
  // 브라우저가 자동재생을 막으면 화면을 처음 터치할 때 재생.
  // 음악 버튼 터치는 버튼이 직접 처리하고, 스크롤처럼 재생이 거부된 터치 뒤에도 다음 터치에서 다시 시도
  function firstTouch(e) {
    if (bgmBtn.contains(e.target)) return;
    if (userPaused || !audio.paused) { stopUnlock(); return; }
    tryPlay().then(stopUnlock, function () {});
  }
  UNLOCK_EVENTS.forEach(function (ev) { document.addEventListener(ev, firstTouch, true); });
  tryPlay().then(stopUnlock, function () {});
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (!audio.paused) { audio.pause(); audio.dataset.resume = '1'; } }
    else if (audio.dataset.resume) { delete audio.dataset.resume; tryPlay(); }
  });

  /* 갤러리 */
  var grid = document.getElementById('gGrid'), scroller = document.getElementById('gScroll');
  var track = document.getElementById('gTrack'), thumb = document.getElementById('gThumb');
  for (var i = 1; i <= PHOTO_COUNT; i++) {
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'g-item'; btn.dataset.idx = i;
    btn.setAttribute('aria-label', i + '번 사진 크게 보기');
    var style = '';
    if (PHOTO_POS[i]) style = 'object-position:' + PHOTO_POS[i] + ' 50%';
    if (PHOTO_ZOOM[i]) style = 'transform:scale(' + PHOTO_ZOOM[i][0] + ');transform-origin:' + PHOTO_ZOOM[i][1] + ' 50%';
    btn.innerHTML = '<span class="im"><img loading="lazy" src="images/thumb/' + i + '.jpg" alt="" style="' + style + '"></span><span class="no">(' + pad(i) + ')</span>';
    grid.appendChild(btn);
  }
  function syncScroll() {
    var max = scroller.scrollHeight - scroller.clientHeight;
    var ratio = max > 0 ? scroller.scrollTop / max : 0;
    thumb.style.transform = 'translateY(' + (track.clientHeight - thumb.offsetHeight) * ratio + 'px)';
  }
  scroller.addEventListener('scroll', syncScroll, { passive: true });
  window.addEventListener('resize', syncScroll);
  syncScroll();

  // 스크롤바 드래그
  (function () {
    var dragging = false, startY, startTop;
    function down(e) {
      dragging = true; startY = (e.touches ? e.touches[0] : e).clientY; startTop = scroller.scrollTop;
      e.preventDefault();
    }
    function move(e) {
      if (!dragging) return;
      var dy = (e.touches ? e.touches[0] : e).clientY - startY;
      var room = track.clientHeight - thumb.offsetHeight;
      scroller.scrollTop = startTop + dy / room * (scroller.scrollHeight - scroller.clientHeight);
    }
    function up() { dragging = false; }
    thumb.addEventListener('mousedown', down); thumb.addEventListener('touchstart', down, { passive: false });
    window.addEventListener('mousemove', move); window.addEventListener('touchmove', move, { passive: true });
    window.addEventListener('mouseup', up); window.addEventListener('touchend', up);
  })();

  /* 라이트박스 */
  var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbNo = document.getElementById('lbNo');
  var cur = 1;
  function show(n) {
    cur = (n - 1 + PHOTO_COUNT) % PHOTO_COUNT + 1;
    lbImg.src = 'images/' + cur + '.jpg';
    lbNo.textContent = pad(cur) + ' / ' + pad(PHOTO_COUNT);
  }
  function openLb(n) { show(n); lb.classList.add('open'); document.body.style.overflow = 'hidden'; }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  grid.addEventListener('click', function (e) {
    var item = e.target.closest('.g-item'); if (item) openLb(+item.dataset.idx);
  });
  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lbPrev').addEventListener('click', function () { show(cur - 1); });
  document.getElementById('lbNext').addEventListener('click', function () { show(cur + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });
  var sx = null;
  lb.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
  });

  /* 지도: 카카오맵 약도(키 불필요)를 기본으로 쓰고, 불러오지 못하면 구글 지도로 대체.
     네이버 Client ID를 넣으면 네이버 지도를 우선 사용 */
  // 네이버 클라우드 플랫폼 > Maps > Application 등록 후 받은 Client ID (선택)
  var NAVER_MAP_CLIENT_ID = '';
  // place.map.kakao.com/1574920035 > 약도만들기 에서 생성한 소스 (노출정보 모두 끔, 한 단계 축소)
  var KAKAO_ROUGHMAP = { timestamp: '1794325421613', key: '4shgnhhhzc2' };
  var KAKAO_PLACE_ID = '1574920035'; // 카카오맵 SY컨벤션
  var VENUE = { lat: 37.25449, lng: 127.07505 }; // 경기 수원시 영통구 봉영로 1612
  var MAP_ZOOM = 15;
  function loadScript(src, onload, onerror) {
    var s = document.createElement('script');
    s.src = src; s.onload = onload; s.onerror = onerror;
    document.head.appendChild(s);
  }
  var mapBox = document.getElementById('mapBox');
  function showGoogleMap() {
    mapBox.innerHTML = '<iframe title="SY컨벤션 지도" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=' +
      encodeURIComponent('경기도 수원시 영통구 봉영로 1612') + '&z=' + MAP_ZOOM + '&hl=ko&output=embed"></iframe>';
  }
  function showNaverMap() {
    mapBox.innerHTML = '<div id="naverMap"></div>';
    var pos = new naver.maps.LatLng(VENUE.lat, VENUE.lng);
    var map = new naver.maps.Map('naverMap', { center: pos, zoom: MAP_ZOOM, scaleControl: false, mapDataControl: false });
    new naver.maps.Marker({ position: pos, map: map });
  }
  function tryKakao() {
    if (!(window.daum && daum.roughmap && daum.roughmap.Lander)) { showGoogleMap(); return; }
    mapBox.innerHTML = '<div id="daumRoughmapContainer' + KAKAO_ROUGHMAP.timestamp + '" class="root_daum_roughmap root_daum_roughmap_landing"></div>';
    new daum.roughmap.Lander({
      timestamp: KAKAO_ROUGHMAP.timestamp,
      key: KAKAO_ROUGHMAP.key,
      mapWidth: String(mapBox.clientWidth),
      mapHeight: String(mapBox.clientHeight - 32) // 하단 카카오맵 안내 바(32px) 포함해서 칸에 맞춤
    }).render();
  }
  if (NAVER_MAP_CLIENT_ID) {
    window.navermap_authFailure = tryKakao;
    loadScript('https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(NAVER_MAP_CLIENT_ID),
      showNaverMap, tryKakao);
  } else tryKakao();

  /* 티켓 뜯기: 절취선 부분이 화면에 충분히 들어오면 한 번 실행 */
  var stub = document.getElementById('ticketStub');
  if ('IntersectionObserver' in window) {
    var tearIo = new IntersectionObserver(function (es) {
      if (!es[0].isIntersecting) return;
      tearIo.disconnect();
      setTimeout(function () { stub.classList.add('torn'); }, 900);
    }, { threshold: 0.9 });
    tearIo.observe(stub);
  } else stub.classList.add('torn');

  /* 지도 앱 */
  document.getElementById('naverBtn').href = 'https://map.naver.com/p/search/' + encodeURIComponent(PLACE);
  document.getElementById('kakaoBtn').href = 'https://map.kakao.com/link/map/' + KAKAO_PLACE_ID;
  document.getElementById('tmapBtn').addEventListener('click', function () {
    if (!isMobile) { toast('티맵은 모바일에서 이용하실 수 있습니다'); return; }
    var start = Date.now();
    location.href = 'tmap://search?name=' + encodeURIComponent(PLACE);
    setTimeout(function () {
      // 앱이 열리지 않았으면 스토어로 이동
      if (!document.hidden && Date.now() - start < 2500) {
        location.href = isIOS ? 'https://apps.apple.com/kr/app/id431589174'
                              : 'https://play.google.com/store/apps/details?id=com.skt.tmap.ku';
      }
    }, 1500);
  });

  /* 계좌 아코디언: 접힌 상태(아래 화살표)로 시작, 펼치면 위 화살표 */
  document.querySelectorAll('.acc-head').forEach(function (h) {
    h.addEventListener('click', function () {
      var open = h.parentElement.classList.toggle('open');
      h.setAttribute('aria-expanded', open);
    });
  });

  /* 방명록 */
  var GB_API = '/api/guestbook', GB_PAGE = 5;
  var gbForm = document.getElementById('gbForm'), gbList = document.getElementById('gbList');
  var gbMore = document.getElementById('gbMore'), gbSubmit = document.getElementById('gbSubmit');
  var gbMsg = document.getElementById('gbMsg'), gbCount = document.getElementById('gbCount');
  var gbEntries = [], gbShown = GB_PAGE;
  function fmtDate(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
  }
  function gbRender() {
    gbList.innerHTML = '';
    if (!gbEntries.length) {
      var empty = document.createElement('li');
      empty.className = 'hand gb-empty';
      empty.textContent = '첫 번째 축하 메시지를 남겨주세요.';
      gbList.appendChild(empty);
    }
    gbEntries.slice(0, gbShown).forEach(function (e) {
      var li = document.createElement('li');
      var who = document.createElement('div'); who.className = 'who';
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.name;
      var meta = document.createElement('span'); meta.className = 'meta';
      var dt = document.createElement('span'); dt.className = 'dt'; dt.textContent = fmtDate(e.ts);
      var del = document.createElement('button'); del.type = 'button'; del.className = 'gb-del'; del.textContent = '삭제';
      var msg = document.createElement('p'); msg.className = 'msg'; msg.textContent = e.message;
      // 삭제 누르면 비밀번호 칸이 열림
      var delForm = document.createElement('form'); delForm.className = 'gb-delform'; delForm.hidden = true;
      var pw = document.createElement('input'); pw.type = 'password'; pw.placeholder = '작성 시 입력한 비밀번호';
      pw.setAttribute('aria-label', '삭제 비밀번호'); pw.autocomplete = 'off';
      var ok = document.createElement('button'); ok.type = 'submit'; ok.textContent = '확인';
      delForm.appendChild(pw); delForm.appendChild(ok);
      del.addEventListener('click', function () { delForm.hidden = !delForm.hidden; if (!delForm.hidden) pw.focus(); });
      delForm.addEventListener('submit', function (ev) { ev.preventDefault(); gbDelete(e.id, pw.value, ok); });
      meta.appendChild(dt); meta.appendChild(del);
      who.appendChild(nm); who.appendChild(meta); li.appendChild(who); li.appendChild(msg); li.appendChild(delForm);
      gbList.appendChild(li);
    });
    gbMore.hidden = gbEntries.length <= gbShown;
  }
  function gbLoad() {
    fetch(GB_API, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw r; return r.json(); })
      .then(function (data) { gbEntries = data.entries || []; gbRender(); })
      .catch(function () { gbEntries = []; gbRender(); });
  }
  function gbFetch(method, payload) {
    return fetch(GB_API, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw d; return d; }); });
  }
  function gbDelete(id, password, btn) {
    if (!password) { toast('비밀번호를 입력해 주세요'); return; }
    btn.disabled = true;
    gbFetch('DELETE', { id: id, password: password })
      .then(function () {
        gbEntries = gbEntries.filter(function (e) { return e.id !== id; });
        gbRender();
        toast('삭제되었습니다');
      })
      .catch(function (err) { btn.disabled = false; toast((err && err.error) || '잠시 후 다시 시도해 주세요'); });
  }
  gbMore.addEventListener('click', function () { gbShown += GB_PAGE; gbRender(); });
  gbMsg.addEventListener('input', function () { gbCount.textContent = gbMsg.value.length; });
  gbForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('gbName').value.trim(), message = gbMsg.value.trim();
    var password = document.getElementById('gbPw').value;
    if (!name || !message) { toast('이름과 메시지를 입력해 주세요'); return; }
    if (password.length < 4) { toast('비밀번호는 4자 이상 입력해 주세요'); return; }
    gbSubmit.disabled = true;
    gbFetch('POST', { name: name, message: message, password: password, website: gbForm.elements.website.value })
      .then(function (d) {
        gbEntries.unshift(d.entry);
        gbForm.reset(); gbCount.textContent = '0';
        gbRender();
        toast('축하 메시지가 등록되었습니다');
      })
      .catch(function (err) { toast((err && err.error) || '잠시 후 다시 시도해 주세요'); })
      .then(function () { gbSubmit.disabled = false; });
  });
  gbLoad();
})();
</script>
</body>
</html>
